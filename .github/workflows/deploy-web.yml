name: Publish playable Web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Cache Web export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-web-templates-v1

      - name: Ensure Web export templates are installed
        run: |
          set -euo pipefail
          dir="$HOME/.local/share/godot/export_templates/4.3.stable"
          if [ ! -s "$dir/web_nothreads_release.zip" ]; then
            mkdir -p "$dir"
            curl -fL --retry 3 --retry-delay 3 \
              "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
              -o /tmp/godot_export_templates.tpz
            unzip -j /tmp/godot_export_templates.tpz \
              "templates/web_nothreads_release.zip" \
              "templates/web_nothreads_debug.zip" -d "$dir"
            printf '4.3.stable\n' > "$dir/version.txt"
          fi
          test -s "$dir/web_nothreads_release.zip"

      - name: Import game resources
        run: godot --headless --path . --import

      - name: Export playable website
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          test -s build/web/index.html
          test -s build/web/index.wasm

      # Keep a playable Web export downloadable even when GitHub Pages is not
      # enabled in repository Settings > Pages yet.
      - name: Upload playable Web export
        uses: actions/upload-artifact@v4
        with:
          name: pocket-district-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
