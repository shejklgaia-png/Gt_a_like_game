name: Publish playable Web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Import game resources
        run: godot --headless --path . --import

      - name: Export playable website
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          test -s build/web/index.html
          test -s build/web/index.wasm

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
