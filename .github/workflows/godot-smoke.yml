name: Godot 4 smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  godot-smoke:
    name: Godot ${{ matrix.godot-version }} headless stability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.4.1", "4.7.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false
      - name: Import Godot project
        run: godot --headless --path . --editor --import --quit
      - name: Run generated-world smoke tests
        run: godot --headless --path . --script res://scripts/smoke_test.gd
      - name: Run extended autonomous simulation
        run: godot --headless --path . --script res://scripts/simulation_test.gd
      - name: Verify city zoning, freeway, home purchases, furniture and indoor encounters
        run: godot --headless --path . --script res://scripts/district_test.gd
      - name: Test Android-only startup and diagnostic lifecycle
        run: godot --headless --path . --script res://scripts/android_runtime_test.gd
      - name: Run sustained-play and autosave stability regression
        run: godot --headless --path . --script res://scripts/stability_test.gd
      - name: Exercise one hundred deterministic open-world QA cycles
        run: godot --headless --path . --script res://scripts/hundred_cycle_test.gd
      - name: Validate citizen routines, neighborhood jobs and owned garage vehicle
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/city_life_test.gd 2>&1 | tee /tmp/pocket_city_life_test.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/pocket_city_life_test.log; then
            echo "Unexpected GDScript runtime or parse error in city-life test"
            exit 1
          fi
      - name: Validate CITY phone discovery, live GPS, mobile buttons and persisted routes
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/city_phone_test.gd 2>&1 | tee /tmp/pocket_city_phone.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/pocket_city_phone.log; then
            echo "GDScript error detected during CITY phone test"
            exit 1
          fi
      - name: Validate building-aware GPS paths, next-turn guidance and route cache
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/city_route_test.gd 2>&1 | tee /tmp/pocket_city_route.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/pocket_city_route.log; then
            echo "GDScript error detected during CITY route test"
            exit 1
          fi
      - name: Validate crosswalk-safe walking routes and real garage ACTION entry
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/sidewalk_route_test.gd 2>&1 | tee /tmp/pocket_sidewalk_route.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/pocket_sidewalk_route.log; then
            echo "GDScript error detected during crossing/garage integration test"
            exit 1
          fi
      - name: Test dialogue-origin activity routes, rewards, rapport, and save/load
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://scripts/conversation_activity_test.gd 2>&1 | tee /tmp/pocket_conversation_activity.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/pocket_conversation_activity.log; then
            echo "GDScript error detected during conversation-activity integration test"
            exit 1
          fi
      - name: Validate all 200 quests, real event triggers, stage rewards and safe saves
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://scripts/quest_200_test.gd 2>&1 | tee /tmp/pocket_200_quests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/pocket_200_quests.log; then
            echo "Quest regression detected GDScript errors"
            exit 1
          fi
