name: Godot 4 smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  godot-smoke:
    name: Godot ${{ matrix.godot-version }} headless stability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.4.1", "4.7.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false
      - name: Import Godot project
        run: godot --headless --path . --editor --import --quit
      - name: Run generated-world smoke tests
        run: godot --headless --path . --script res://scripts/smoke_test.gd
      - name: Run extended autonomous simulation
        run: godot --headless --path . --script res://scripts/simulation_test.gd
      - name: Run sustained-play and autosave stability regression
        run: godot --headless --path . --script res://scripts/stability_test.gd
